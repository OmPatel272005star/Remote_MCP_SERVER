[project]
name = "remote-mcp-server"
version = "0.1.0"
description = "Minimal 2-tool weather MCP server (Open-Meteo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.10",
    "httpx>=0.28.0",
]

[project.scripts]
remote-mcp-server = "remote_mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
